name: skylink-care

# Local runtime. Values come from .env (create it with `make init`); nothing secret lives in this
# file. Each process is given only the variables it needs: the API holds no gateway key at all,
# the orchestrator holds the read-only agent keys, the feed consumer holds the one key that can
# read the NOC event feed, and only the executor holds the write key.
#
#   make up          PostgreSQL only (processes run on the host with scripts/dev_stack.sh)
#   make stack-up    everything in containers, including data generation and seeding

x-care-image: &care-image
  build: .
  image: skylink-care:local
  restart: unless-stopped

x-care-db: &care-db
  CARE_ENV: ${CARE_ENV:-dev}
  CARE_DB_HOST: postgres
  CARE_DB_PORT: "5432"
  CARE_DB_NAME: ${CARE_DB_NAME:?run make init}
  CARE_DB_USER: ${CARE_DB_USER:?run make init}
  CARE_DB_PASSWORD: ${CARE_DB_PASSWORD:?run make init}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${CARE_DB_NAME:?run make init}
      POSTGRES_USER: ${CARE_DB_USER:?run make init}
      POSTGRES_PASSWORD: ${CARE_DB_PASSWORD:?run make init}
    ports:
      # Bound to loopback only; 5432 is often taken on developer machines.
      - "127.0.0.1:${CARE_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: generate the data pack if absent, migrate, seed the gateway, load reference data.
  setup:
    <<: *care-image
    profiles: ["stack"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *care-db
      CUSTOMERS: ${CUSTOMERS:-40000}
    volumes:
      - datapack:/data/generated
      - mockstate:/state
    command: ["sh", "/app/setup.sh"]
    configs:
      - source: setup_script
        target: /app/setup.sh

  mock-oss:
    <<: *care-image
    profiles: ["stack"]
    command: ["mock-oss", "serve"]
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      MOCK_OSS_HOST: 0.0.0.0
      MOCK_OSS_PORT: "8081"
      MOCK_OSS_DB: /state/mock_oss.sqlite
      MOCK_OSS_LINE_TEST_DELAY_MS: ${MOCK_OSS_LINE_TEST_DELAY_MS:-300-1500}
      OSS_KEY_TRIAGE: ${OSS_KEY_TRIAGE:?run make init}
      OSS_KEY_DIAGNOSTICS: ${OSS_KEY_DIAGNOSTICS:?run make init}
      OSS_KEY_RESOLUTION: ${OSS_KEY_RESOLUTION:?run make init}
      OSS_KEY_DISPATCH: ${OSS_KEY_DISPATCH:?run make init}
      OSS_KEY_INGEST: ${OSS_KEY_INGEST:?run make init}
      OSS_KEY_EXECUTOR: ${OSS_KEY_EXECUTOR:?run make init}
      OSS_KEY_ADMIN: ${OSS_KEY_ADMIN:?run make init}
    volumes:
      - mockstate:/state
    ports:
      - "127.0.0.1:${MOCK_OSS_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *care-image
    profiles: ["stack"]
    command: ["care-api"]
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *care-db
      # The API signs and checks tokens. It holds no gateway key of any kind.
      CARE_JWT_SECRET: ${CARE_JWT_SECRET:?run make init}
      # Staff sign-in through the dev token endpoint needs this; empty means there is none.
      CARE_DEV_STAFF_KEY: ${CARE_DEV_STAFF_KEY:-}
      CARE_API_HOST: 0.0.0.0
      CARE_API_PORT: "8080"
      # What one caller may do: further contacts and messages a minute, and what one channel
      # integration may open in all. Counted in this process.
      CARE_API_CONTACTS_PER_MINUTE: ${CARE_API_CONTACTS_PER_MINUTE:-5}
      CARE_API_MESSAGES_PER_MINUTE: ${CARE_API_MESSAGES_PER_MINUTE:-20}
      CARE_API_CHANNEL_CONTACTS_PER_SECOND: ${CARE_API_CHANNEL_CONTACTS_PER_SECOND:-60}
      CARE_API_CHANNEL_BURST: ${CARE_API_CHANNEL_BURST:-600}
      CARE_STATUS_MAX_AGE_SECONDS: ${CARE_STATUS_MAX_AGE_SECONDS:-60}
      CARE_SURGE_WAITING_CONTACTS: ${CARE_SURGE_WAITING_CONTACTS:-200}
      CARE_SURGE_WAITING_SECONDS: ${CARE_SURGE_WAITING_SECONDS:-15}
      CARE_WORKER_CONCURRENCY: ${CARE_WORKER_CONCURRENCY:-8}
    ports:
      - "127.0.0.1:${CARE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *care-image
    profiles: ["stack"]
    command: ["care-worker"]
    depends_on:
      mock-oss:
        condition: service_healthy
    environment:
      <<: *care-db
      CARE_OSS_BASE_URL: http://mock-oss:8081
      CARE_OSS_BREAKER_FAILURES: ${CARE_OSS_BREAKER_FAILURES:-5}
      CARE_OSS_BREAKER_REST_SECONDS: ${CARE_OSS_BREAKER_REST_SECONDS:-10}
      CARE_OSS_READ_RETRIES: ${CARE_OSS_READ_RETRIES:-1}
      CARE_LLM_PROVIDER: ${CARE_LLM_PROVIDER:-offline}
      CARE_LLM_MODEL: ${CARE_LLM_MODEL:-claude-opus-5-5}
      CARE_LLM_OPENAI_MODEL: ${CARE_LLM_OPENAI_MODEL:-gpt-5.4-mini}
      CARE_LLM_OPENAI_REASONING_EFFORT: ${CARE_LLM_OPENAI_REASONING_EFFORT:-low}
      CARE_LLM_SIMULATED_LATENCY_SECONDS: ${CARE_LLM_SIMULATED_LATENCY_SECONDS:-1.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Traces of the workflow, off unless asked for; what is traced stays hidden unless asked.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-skylink-care}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-true}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-true}
      CARE_IDENTITY_FAIL_LIMIT: ${CARE_IDENTITY_FAIL_LIMIT:-5}
      CARE_IDENTITY_FAIL_WINDOW_SECONDS: ${CARE_IDENTITY_FAIL_WINDOW_SECONDS:-3600}
      CARE_IDENTITY_FAIL_DAILY_LIMIT: ${CARE_IDENTITY_FAIL_DAILY_LIMIT:-10}
      CARE_IDENTITY_SPREAD_ALERT_CUSTOMERS: ${CARE_IDENTITY_SPREAD_ALERT_CUSTOMERS:-50}
      CARE_SURGE_WAITING_CONTACTS: ${CARE_SURGE_WAITING_CONTACTS:-200}
      CARE_SURGE_WAITING_SECONDS: ${CARE_SURGE_WAITING_SECONDS:-15}
      CARE_WORKER_CONCURRENCY: ${CARE_WORKER_CONCURRENCY:-8}
      CARE_STATUS_MAX_AGE_SECONDS: ${CARE_STATUS_MAX_AGE_SECONDS:-60}
      CARE_FEED_MAX_AGE_SECONDS: ${CARE_FEED_MAX_AGE_SECONDS:-90}
      CARE_LINE_TEST_CLUSTER_THRESHOLD: ${CARE_LINE_TEST_CLUSTER_THRESHOLD:-3}
      CARE_LINE_TEST_CLUSTER_WINDOW_SECONDS: ${CARE_LINE_TEST_CLUSTER_WINDOW_SECONDS:-900}
      CARE_LINE_OWN_FAULT_RATE: ${CARE_LINE_OWN_FAULT_RATE:-0.02}
      CARE_LINE_TEST_CLUSTER_CHANCE: ${CARE_LINE_TEST_CLUSTER_CHANCE:-0.001}
      CARE_LINE_RETEST_SECONDS: ${CARE_LINE_RETEST_SECONDS:-120}
      CARE_DISPATCH_HOLD_SECONDS: ${CARE_DISPATCH_HOLD_SECONDS:-600}
      CARE_VISIT_SLOTS_OFFERED: ${CARE_VISIT_SLOTS_OFFERED:-3}
      CARE_VISIT_LINE_TEST_MAX_AGE_SECONDS: ${CARE_VISIT_LINE_TEST_MAX_AGE_SECONDS:-300}
      CARE_NETWORK_RECHECK_SECONDS: ${CARE_NETWORK_RECHECK_SECONDS:-60}
      CARE_NETWORK_RECHECK_LIMIT: ${CARE_NETWORK_RECHECK_LIMIT:-5}
      CARE_SUSPECTED_WAIT_SECONDS: ${CARE_SUSPECTED_WAIT_SECONDS:-900}
      CARE_OUTAGE_RECHECK_SECONDS: ${CARE_OUTAGE_RECHECK_SECONDS:-900}
      CARE_CREDIT_REVIEW_ALL: ${CARE_CREDIT_REVIEW_ALL:-true}
      CARE_APPROVAL_TTL_SECONDS: ${CARE_APPROVAL_TTL_SECONDS:-259200}
      CARE_CLOSE_QUIET_SECONDS: ${CARE_CLOSE_QUIET_SECONDS:-86400}
      # Read-only agent identities. The write key is deliberately absent.
      OSS_KEY_TRIAGE: ${OSS_KEY_TRIAGE:?run make init}
      OSS_KEY_DIAGNOSTICS: ${OSS_KEY_DIAGNOSTICS:?run make init}
      OSS_KEY_RESOLUTION: ${OSS_KEY_RESOLUTION:?run make init}
      OSS_KEY_DISPATCH: ${OSS_KEY_DISPATCH:?run make init}

  ingest:
    <<: *care-image
    profiles: ["stack"]
    command: ["care-ingest"]
    depends_on:
      mock-oss:
        condition: service_healthy
    environment:
      <<: *care-db
      CARE_OSS_BASE_URL: http://mock-oss:8081
      CARE_OSS_BREAKER_FAILURES: ${CARE_OSS_BREAKER_FAILURES:-5}
      CARE_OSS_BREAKER_REST_SECONDS: ${CARE_OSS_BREAKER_REST_SECONDS:-10}
      CARE_OSS_READ_RETRIES: ${CARE_OSS_READ_RETRIES:-1}
      CARE_NOTIFY_MAX_EVENT_AGE_SECONDS: ${CARE_NOTIFY_MAX_EVENT_AGE_SECONDS:-900}
      # Reads the NOC event feed and nothing else.
      OSS_KEY_INGEST: ${OSS_KEY_INGEST:?run make init}

  executor:
    <<: *care-image
    profiles: ["stack"]
    command: ["care-executor"]
    depends_on:
      mock-oss:
        condition: service_healthy
    environment:
      <<: *care-db
      CARE_OSS_BASE_URL: http://mock-oss:8081
      CARE_OSS_BREAKER_FAILURES: ${CARE_OSS_BREAKER_FAILURES:-5}
      CARE_OSS_BREAKER_REST_SECONDS: ${CARE_OSS_BREAKER_REST_SECONDS:-10}
      CARE_OSS_READ_RETRIES: ${CARE_OSS_READ_RETRIES:-1}
      # It checks the credit policy again before it applies a credit, so it reads the same
      # policy file (part of the image) and the same review switch as the orchestrator.
      CARE_CREDIT_REVIEW_ALL: ${CARE_CREDIT_REVIEW_ALL:-true}
      # Before it books a visit it looks at the node and the line's last test for itself, by the
      # same rule and the same limits as the orchestrator that proposed it.
      CARE_STATUS_MAX_AGE_SECONDS: ${CARE_STATUS_MAX_AGE_SECONDS:-60}
      CARE_FEED_MAX_AGE_SECONDS: ${CARE_FEED_MAX_AGE_SECONDS:-90}
      CARE_LINE_TEST_CLUSTER_THRESHOLD: ${CARE_LINE_TEST_CLUSTER_THRESHOLD:-3}
      CARE_LINE_TEST_CLUSTER_WINDOW_SECONDS: ${CARE_LINE_TEST_CLUSTER_WINDOW_SECONDS:-900}
      CARE_LINE_OWN_FAULT_RATE: ${CARE_LINE_OWN_FAULT_RATE:-0.02}
      CARE_LINE_TEST_CLUSTER_CHANCE: ${CARE_LINE_TEST_CLUSTER_CHANCE:-0.001}
      CARE_DISPATCH_HOLD_SECONDS: ${CARE_DISPATCH_HOLD_SECONDS:-600}
      CARE_VISIT_EVIDENCE_MAX_AGE_SECONDS: ${CARE_VISIT_EVIDENCE_MAX_AGE_SECONDS:-1800}
      # The only process that can write to the enterprise systems.
      OSS_KEY_EXECUTOR: ${OSS_KEY_EXECUTOR:?run make init}

configs:
  setup_script:
    file: ./scripts/container_setup.sh

volumes:
  pgdata:
  datapack:
  mockstate:
