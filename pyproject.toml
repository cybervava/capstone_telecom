[project]
name = "skylink-care"
version = "0.1.0"
description = "Outage-aware customer care agent for SkyLink Telecom (G3 Telco FDE capstone)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.163,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "mcp>=2.3,<3",
    "openai>=3.52,<4",
    "prometheus-client>=0.26,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt>=2.15,<3",
    "pyyaml>=6,<7",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54,<1",
]

[project.scripts]
care-admin = "skylink_care.cli:main"
care-api = "skylink_care.api.main:run"
care-worker = "skylink_care.orchestrator.worker:run"
care-executor = "skylink_care.executor.worker:run"
care-ingest = "skylink_care.ingest.worker:run"
care-mcp = "skylink_care.mcp_server.main:run"
mock-oss = "mock_oss.main:run"
skylink-datagen = "skylink_datagen.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skylink_care", "src/mock_oss", "src/skylink_datagen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # likely bugs
    "SIM", "C4", "RET", "PTH",
    "RUF",
    "S",             # security (bandit)
    "ASYNC",
    "DTZ",           # timezone-aware datetimes only
    "T20",           # no print()
    "PT",
    "N",
]
ignore = [
    "S101",  # assert is used for invariants in tests; see per-file-ignores for src
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/skylink_datagen/**" = ["S311"]   # seeded pseudo-randomness is the point
"src/mock_oss/**" = ["S311"]
"loadtest/**" = ["S311"]
# Its queries are put together from the module's own constants; every value is a bound parameter.
"loadtest/facts.py" = ["S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["skylink_care", "mock_oss", "skylink_datagen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: no external services (applied automatically by directory)",
    "integration: needs the PostgreSQL service from docker compose",
    "contract: needs a running mock_oss instance (started in-process by fixtures)",
    "e2e: needs the full stack",
    "eval: a scored evaluation that writes a report (run with `make eval`, not with the suite)",
]

[tool.coverage.run]
branch = true
source = ["skylink_care"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
