# CI for the SkyLink care agent. Written for GitLab CI; which host the team uses is still open
# (decision D6 in docs/EXECUTION_PLAN.md) and the same four stages port directly.
#
#   verify  lint, strict typing, tests with a coverage gate, secret scan
#   build   container image
#   scan    image vulnerabilities
#   deploy  manual; see the notes on the job

stages: [verify, build, scan, deploy]

variables:
  UV_VERSION: "0.11.19"
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

.python:
  image: python:3.12-slim-bookworm
  before_script:
    - pip install --quiet "uv==$UV_VERSION"
    - uv sync --locked
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

lint:
  extends: .python
  stage: verify
  script:
    - uv run ruff check src tests scripts evals
    - uv run ruff format --check src tests scripts evals
    - uv run mypy

# What needs a database: the test suite and the evaluations.
.with-postgres:
  extends: .python
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_DB: care
    POSTGRES_USER: care
    POSTGRES_PASSWORD: ci-only-not-a-secret
    CARE_ENV: test
    CARE_DB_HOST: postgres
    CARE_DB_PORT: "5432"
    CARE_DB_NAME: care
    CARE_DB_USER: care
    CARE_DB_PASSWORD: ci-only-not-a-secret
    # Integration tests fail, rather than skip, when the database is missing.
    CARE_REQUIRE_DB: "1"

test:
  extends: .with-postgres
  stage: verify
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# The scored evaluations (evals/README.md). A failure here means a target of the brief was
# missed on the stand-in data; the reports say by how much and why.
eval:
  extends: .with-postgres
  stage: verify
  script:
    - uv run pytest evals -p no:cacheprovider --no-cov -q
  artifacts:
    when: always
    paths:
      - evals/reports/

secret-scan:
  stage: verify
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --no-banner

image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH

image-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH

# Deployment is manual and not wired to an environment yet. The target (AWS ECS per the plan, or
# another container host) and the blue-green or canary strategy with rollback steps are milestone
# M7 work; until then this job only records which image would be released.
deploy:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Release candidate $IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
