# CI for the SkyLink care agent, on GitHub Actions (decision D6). The checks of the pipeline
# first written for GitLab, which never ran:
#
#   lint         ruff and strict typing
#   test         the whole suite on PostgreSQL with pgvector, with a coverage gate
#   eval         the seven scored evaluations; their reports are kept as an artifact
#   secret-scan  gitleaks over the whole history (.gitleaksignore lists the findings that are not
#                secrets, by fingerprint)
#   image        the container image built, scanned for HIGH and CRITICAL vulnerabilities that
#                have a fix, and on the dev branch published to the GitHub container registry as
#                a release candidate
#
# Actions are pinned to a commit; the tools run at the versions the Dockerfile and the evidence
# name (uv 0.11.19, gitleaks 8.21.2, Trivy 0.57.1).
name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.19"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts evals loadtest
      - run: uv run ruff format --check src tests scripts evals loadtest
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: care
          POSTGRES_USER: care
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U care -d care"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CARE_ENV: test
      CARE_DB_HOST: 127.0.0.1
      CARE_DB_PORT: "5432"
      CARE_DB_NAME: care
      CARE_DB_USER: care
      CARE_DB_PASSWORD: ci-only-not-a-secret
      # Integration tests fail, rather than skip, when the database is missing.
      CARE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: >-
          uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
          --junitxml=junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  # A failure here means a target of the brief was missed on the stand-in data; the reports say
  # by how much and why (evals/README.md).
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: care
          POSTGRES_USER: care
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U care -d care"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CARE_ENV: test
      CARE_DB_HOST: 127.0.0.1
      CARE_DB_PORT: "5432"
      CARE_DB_NAME: care
      CARE_DB_USER: care
      CARE_DB_PASSWORD: ci-only-not-a-secret
      CARE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest evals -p no:cacheprovider --no-cov -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-reports
          path: evals/reports/

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run as the runner's own user, so that git inside the container owns the checkout.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  image:
    needs: [lint, test, eval, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t skylink-care:ci .
      # Vulnerabilities only: Trivy's secret scanner takes the credential-shaped examples in the
      # Anthropic SDK's docstrings for secrets (docs/evidence/image_scan.md). The scanner is given
      # the image as a file, not the Docker daemon.
      - name: Scan for HIGH and CRITICAL vulnerabilities that have a fix
        run: |
          docker save skylink-care:ci -o image.tar
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" aquasec/trivy:0.57.1 image \
            --input /image.tar --exit-code 1 --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress
      - name: Publish the release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${GITHUB_SHA::12}" dev; do
            docker tag skylink-care:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Release candidate: \`$image:${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
